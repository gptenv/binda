[workspace]
resolver = "2"
members = [
    "crates/binda-core",
    "crates/binda",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jeremy Carter <defcronyke@gmail.com>"]
repository = "https://github.com/defcronyke/binda"
keywords = ["dns", "resolver", "p2p", "gossip", "naming"]
categories = ["network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
